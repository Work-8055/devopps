apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: embarkx/tax-service-b:latest
          # env:
          #   - name: ENV_VALUE
          #     value: "Hello, Kubernetes!"

          #   - name: BD_PASSWORD
          #     value: "mysecretpassword "
          # env:
          #   - name: ENV_VALUE
          #     valueFrom:
          #       configMapKeyRef:
          #         name: service-b-config
          #         key: HELLO_APP_MESSAGE
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: service-b-db-secret
          #         key: HELLO_DB_PASSWORD
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
    - port: 4000
      targetPort: 4000
